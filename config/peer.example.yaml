name: "peer-1"
listen_port: 5001                # Used in LAN listen mode (when host_address is omitted)
model: "models/<model-name>"
device: "auto"                   # auto = GPU if available, else CPU
# layers: [10, 20]               # optional - 0-based inclusive [start, end]; if omitted, host assigns it

# --- For Global / WAN / Kaggle / NAT peers (connect outbound to host) ---
# host_address: "example.trycloudflare.com" # Host's tunnel/public hostname
# host_port: 443                            # Use 443 with host_transport: "wss" for Kaggle
# host_transport: "wss"                     # "tcp" (default) or "wss" (WebSocket over port 443)
# auth_token: "my-secret-token"             # Must match host.yaml if set
